<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess-A-Word</title>
    <style>
        :root {
            --correct: #6aaa64;  /* Green */
            --present: #c9b458;  /* Yellow */
            --absent: #e53e3e;   /* RED */
            --default: #121213;  /* Background */
            --border: #3a3a3c;
            --text: #ffffff;
            --key-bg: #818384;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--default);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            margin: 0;
            height: 100vh;
            overflow: hidden; 
        }

        h1 {
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
            margin: 0;
            font-size: 1.5rem;
            text-align: center;
        }

        /* Game Board */
        #board-container {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            padding: 10px;
            box-sizing: border-box;
            flex-grow: 1;
            justify-content: center;
            align-content: center;
            max-height: 420px; /* Prevent board from getting too tall on large screens */
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .tile {
            width: 52px;
            height: 52px;
            border: 2px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
            box-sizing: border-box;
        }

        /* Keyboard Styles */
        #keyboard-container {
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            padding: 0 8px;
            box-sizing: border-box;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
            width: 100%;
            touch-action: manipulation;
        }

        .key {
            font-family: inherit;
            font-weight: bold;
            border: 0;
            padding: 0;
            margin: 0 3px;
            height: 58px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            background-color: var(--key-bg);
            color: var(--text);
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .key.large {
            flex: 1.5;
            font-size: 0.8rem;
        }

        /* States */
        .tile.filled {
            border-color: #818384;
            animation: pop 0.1s;
        }

        .tile.flip {
            animation: flip 0.6s ease-in;
        }

        /* Color Classes */
        .correct { 
            background-color: var(--correct) !important; 
            border-color: var(--correct) !important; 
        }
        
        .present { 
            background-color: var(--present) !important; 
            border-color: var(--present) !important; 
        }
        
        .absent { 
            background-color: var(--absent) !important; 
            border-color: var(--absent) !important; 
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }

        /* Message */
        #message-container {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 10;
        }

        .toast {
            background-color: #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 4px;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: var(--correct);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
        }

        /* Mobile Optimization */
        @media (max-height: 700px) {
            .tile { width: 40px; height: 40px; font-size: 1.5rem; }
            .key { height: 45px; }
            h1 { font-size: 1.2rem; }
            #board-container { max-height: 350px; }
        }
    </style>
</head>

            "LION", "LIP", "LIQUID", "LISLE", "LISP", "LIST", "LIT", "LITER", "LITHE",
            "LITTLE", "LIVE", "LIVELY", "LIVER", "LIZARD", "LOAD", "LOAF", "LOAM",
            "LOAN", "LOATHE", "LOB", "LOBBY", "LOBE", "LOCAL", "LOCK", "LOCO", "LOCUST",
            "LODGE", "LOFT", "LOFTY", "LOG", "LOGIC", "LOGIN", "LOIN", "LONE", "LONER",
            "LONG", "LOOK", "LOOM", "LOON", "LOOP", "LOOSE", "LOOT", "LOP", "LORD",
            "LORE", "LOSE", "LOSER", "LOSS", "LOST", "LOT", "LOTION", "LOTTO",
            "LOTUS", "LOUD", "LOUNGE", "LOUSE", "LOUSY", "LOUT", "LOVE", "LOVER",
            "LOW", "LOWER", "LOWLY", "LOYAL", "LUCK", "LUCKY", "LUGE", "LULL", "LUMEN",
            "LUMP", "LUMPY", "LUNAR", "LUNCH", "LUNGE", "LUNG", "LUPUS", "LURCH",
            "LURE", "LURID", "LURK", "LUSH", "LUST", "LUTE", "LUXURY", "LYING",
            "LYMPH", "LYRIC"
        ];
        
        // Merge them for validity checks
        const validGuesses = new Set([...answers, ...extras]);

        const rows = 6;
        const cols = 5;
        const keys = [
            "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P",
            "A", "S", "D", "F", "G", "H", "J", "K", "L",
            "ENTER", "Z", "X", "C", "V", "B", "N", "M", "⌫"
        ];

        // --- STATE VARIABLES ---
        let currentRow = 0;
        let currentTile = 0;
        let targetWord = "";
        let guesses = [];
        let isGameOver = false;

        const boardContainer = document.getElementById("board-container");
        const keyboardContainer = document.getElementById("keyboard-container");
        const messageContainer = document.getElementById("message-container");
        const restartBtn = document.getElementById("restart-btn");

        // --- INITIALIZATION ---
        function initGame() {
            currentRow = 0;
            currentTile = 0;
            guesses = Array(rows).fill().map(() => Array(cols).fill(""));
            isGameOver = false;
            messageContainer.innerHTML = "";
            restartBtn.style.display = "none";
            
            // Pick from Answers list only
            targetWord = answers[Math.floor(Math.random() * answers.length)];
            console.log("Target:", targetWord); // For debug
            console.log("Total Answers Available:", answers.length);

            createBoard();
            createKeyboard();
        }

        function createBoard() {
            boardContainer.innerHTML = "";
            for (let r = 0; r < rows; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.classList.add('row');
                rowDiv.setAttribute('id', 'row-' + r);
                for (let c = 0; c < cols; c++) {
                    const tileDiv = document.createElement('div');
                    tileDiv.classList.add('tile');
                    tileDiv.setAttribute('id', 'row-' + r + '-tile-' + c);
                    rowDiv.appendChild(tileDiv);
                }
                boardContainer.appendChild(rowDiv);
            }
        }

        function createKeyboard() {
            keyboardContainer.innerHTML = "";
            
            const row1 = keys.slice(0, 10);
            const row2 = keys.slice(10, 19);
            const row3 = keys.slice(19);

            [row1, row2, row3].forEach(rowKeys => {
                const rowDiv = document.createElement('div');
                rowDiv.classList.add('keyboard-row');
                rowKeys.forEach(key => {
                    const btn = document.createElement('button');
                    btn.textContent = key;
                    btn.setAttribute('id', 'key-' + key);
                    btn.classList.add('key');
                    if (key === 'ENTER' || key === '⌫') {
                        btn.classList.add('large');
                    }
                    btn.addEventListener('click', () => handleKeyClick(key));
                    rowDiv.appendChild(btn);
                });
                keyboardContainer.appendChild(rowDiv);
            });
        }

        // --- INPUT HANDLING ---
        function handleKeyClick(key) {
            if (key === 'ENTER') {
                checkRow();
            } else if (key === '⌫') {
                deleteLetter();
            } else {
                addLetter(key);
            }
        }

        document.addEventListener('keydown', (e) => {
            if(isGameOver) return;
            const key = e.key.toUpperCase();
            if (key === 'ENTER') checkRow();
            else if (key === 'BACKSPACE') deleteLetter();
            else if (/^[A-Z]$/.test(key)) addLetter(key);
        });

        // --- GAME LOGIC ---
        function addLetter(letter) {
            if (isGameOver) return;
            if (currentTile < cols) {
                const tile = document.getElementById(`row-${currentRow}-tile-${currentTile}`);
                tile.textContent = letter;
                tile.classList.add('filled');
                guesses[currentRow][currentTile] = letter;
                currentTile++;
            }
        }

        function deleteLetter() {
            if (isGameOver) return;
            if (currentTile > 0) {
                currentTile--;
                const tile = document.getElementById(`row-${currentRow}-tile-${currentTile}`);
                tile.textContent = "";
                tile.classList.remove('filled');
                guesses[currentRow][currentTile] = "";
            }
        }

        function checkRow() {
            if (isGameOver) return;
            if (currentTile < cols) {
                showMessage("Not enough letters");
                shakeRow();
                return;
            }

            const guessWord = guesses[currentRow].join("");
            
            // Check against the merged Set of valid words
            if (!validGuesses.has(guessWord)) {
                showMessage("Word not in list");
                shakeRow();
                return;
            }

            flipTiles();
            
            if (guessWord === targetWord) {
                showMessage("Splendid!");
                isGameOver = true;
                restartBtn.style.display = "block";
            } else {
                if (currentRow >= rows - 1) {
                    isGameOver = true;
                    showMessage("Game Over! Word: " + targetWord);
                    restartBtn.style.display = "block";
                } else {
                    currentRow++;
                    currentTile = 0;
                }
            }
        }

        // --- ANIMATIONS & COLORING ---
        function flipTiles() {
            const rowTiles = document.getElementById(`row-${currentRow}`).children;
            const guess = guesses[currentRow];
            const checkTarget = targetWord.split("");
            const colors = Array(5).fill("absent");

            // 1. Find Greens
            for (let i = 0; i < 5; i++) {
                if (guess[i] === checkTarget[i]) {
                    colors[i] = "correct";
                    checkTarget[i] = null;
                }
            }

            // 2. Find Yellows
            for (let i = 0; i < 5; i++) {
                if (colors[i] === "correct") continue;
                const index = checkTarget.indexOf(guess[i]);
                if (index > -1) {
                    colors[i] = "present";
                    checkTarget[index] = null;
                }
            }

            // Apply colors
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    // Color Board Tile
                    const tile = rowTiles[i];
                    tile.classList.add('flip');
                    tile.classList.add(colors[i]);
                    tile.style.border = "none";

                    // Color Keyboard Key
                    const keyLetter = guess[i];
                    const keyBtn = document.getElementById('key-' + keyLetter);
                    
                    if (keyBtn) {
                        const oldClass = keyBtn.classList.contains('correct') ? 'correct' : 
                                         keyBtn.classList.contains('present') ? 'present' : 
                                         keyBtn.classList.contains('absent') ? 'absent' : '';

                        // Upgrade logic
                        if (colors[i] === 'correct') {
                            keyBtn.classList.remove('present', 'absent');
                            keyBtn.classList.add('correct');
                        } else if (colors[i] === 'present' && oldClass !== 'correct') {
                            keyBtn.classList.remove('absent');
                            keyBtn.classList.add('present');
                        } else if (colors[i] === 'absent' && oldClass !== 'correct' && oldClass !== 'present') {
                            keyBtn.classList.add('absent');
                        }
                    }

                }, 300 * i);
            }
        }

        function showMessage(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.classList.add('toast');
            messageContainer.innerHTML = '';
            messageContainer.appendChild(toast);
            setTimeout(() => {
                if(messageContainer.contains(toast)) {
                    messageContainer.removeChild(toast);
                }
            }, 2000);
        }

        function shakeRow() {
            const row = document.getElementById(`row-${currentRow}`);
            row.style.animation = "shake 0.5s";
            setTimeout(() => row.style.animation = "", 500);
        }

        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes shake {
                0% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                50% { transform: translateX(5px); }
                75% { transform: translateX(-5px); }
                100% { transform: translateX(0); }
            }
        `;
        document.head.appendChild(styleSheet);

        initGame();

    </script>
