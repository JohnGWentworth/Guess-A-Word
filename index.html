    <style>
        /* Custom Animations */
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          75% { transform: translateX(5px); }
        }
        @keyframes pop {
          0% { transform: scale(1); }
          50% { transform: scale(1.1); }
          100% { transform: scale(1); }
        }
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translate(-50%, -40%); }
          to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .animate-pop { animation: pop 0.1s ease-in-out; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out; }
        .flip-in { animation: flip 0.6s ease forwards; }
        @keyframes flip {
          0% { transform: rotateX(0); }
          50% { transform: rotateX(90deg); }
          100% { transform: rotateX(0); }
        }
    </style>

        const mulberry32 = (a) => {
            return () => {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        const getDailySeed = () => {
          const date = new Date();
          return parseInt(`${date.getFullYear()}${date.getMonth() + 1}${date.getDate()}`);

            const seed = getDailySeed();
            const rng = mulberry32(seed);
            
            const hardWords = WORD_LIST.filter(w => w.length >= 6);
            const wordIdx = Math.floor(rng() * hardWords.length);
            const word = hardWords[wordIdx];
            
            const toughMonsters = MONSTERS.slice(-4); 
            const monsterIdx = Math.floor(rng() * toughMonsters.length);
            const monster = toughMonsters[monsterIdx];
            
            return { word, monster };

        const Keyboard = ({ onKeyPress, usedLetters }) => {
          const rows = [
            ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
            ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'BACK']
          ];

          const getKeyStyle = (key) => {
            if (key === 'ENTER' || key === 'BACK') return 'bg-slate-600 text-white w-14 text-xs';
            const status = usedLetters[key];
            if (status === 'correct') return 'bg-green-600 text-white border-green-700';
            if (status === 'present') return 'bg-yellow-600 text-white border-yellow-700';
            if (status === 'absent') return 'bg-slate-800 text-slate-500 border-slate-900';
            return 'bg-slate-700 text-white border-b-4 border-slate-800 hover:bg-slate-600 active:border-b-0 active:translate-y-1';
          };

          return (
            <div className="w-full max-w-lg p-2 gap-2 flex flex-col items-center select-none">
              {rows.map((row, i) => (
                <div key={i} className="flex gap-1 justify-center w-full">
                  {row.map((key) => (
                    <button
                      key={key}
                      onClick={() => onKeyPress(key)}
                      className={`h-12 rounded font-bold transition-all shadow-sm flex items-center justify-center ${key.length === 1 ? 'w-8 sm:w-10' : ''} ${getKeyStyle(key)}`}
                    >
                      {key === 'BACK' ? <X className="w-5 h-5" /> : key}
                    </button>
                  ))}
                </div>
              ))}
            </div>
          );
        };

        const Grid = ({ guesses, currentGuess, turn, shake, wordLength, revealedIndices, targetWord }) => {
          const empties = Array.from({ length: MAX_GUESSES - 1 - turn }).map(() => "");

          return (
            <div className="flex-1 flex flex-col justify-center items-center gap-1.5 p-4 overflow-y-auto">
              {guesses.map((guess, i) => (
                <div key={i} className="flex gap-1.5">
                  {guess.map((l, j) => (
                    <div 
                      key={j} 
                      className={`
                        w-12 h-12 sm:w-14 sm:h-14 border-2 flex items-center justify-center text-2xl font-bold uppercase select-none rounded
                        transition-all duration-500 transform flip-in
                        ${l.status === 'correct' ? 'bg-green-600 border-green-700 text-white' : 
                          l.status === 'present' ? 'bg-yellow-600 border-yellow-700 text-white' : 
                          'bg-slate-700 border-slate-800 text-slate-400'}

                      style={{ animationDelay: `${j * 100}ms` }}

              {turn < MAX_GUESSES && (
                <div className={`flex gap-1.5 ${shake ? 'animate-shake' : ''}`}>

                    <div 
                      key={i} 
                      className={`
                        w-12 h-12 sm:w-14 sm:h-14 border-2 flex items-center justify-center text-2xl font-bold uppercase rounded
                        ${currentGuess[i] ? 'border-slate-400 bg-slate-800 text-white animate-pop' : 
                          revealedIndices.includes(i) ? 'border-blue-500 bg-blue-900/40 text-blue-200' : 'border-slate-700 bg-slate-900/50'}
                      `}
                    >
                      {currentGuess[i] || (revealedIndices.includes(i) && targetWord ? targetWord[i] : "")}

                  ))}
                </div>
              )}

              {empties.map((_, i) => (
                <div key={i + 99} className="flex gap-1.5 opacity-30">

                       {revealedIndices.includes(j) && targetWord ? targetWord[j] : ""}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          );
        };

        // --- GAME LOGIC CONTAINER ---

        function Game() {
          const [hp, setHp] = useState(STARTING_HP);
          const [maxHp, setMaxHp] = useState(STARTING_HP);
          const [gold, setGold] = useState(STARTING_GOLD);
          const [level, setLevel] = useState(1);
          const [activeBuffs, setActiveBuffs] = useState({});
          const [difficulty, setDifficulty] = useState('NORMAL');
          
          const [stats, setStats] = useState({
              highScoreEasy: 0,
              highScoreNormal: 0,
              highScoreHard: 0,
              totalGold: 0,
              monstersSlain: 0
          });
          const [isNewRecord, setIsNewRecord] = useState(false);
          const [dailyCompleted, setDailyCompleted] = useState(false);
          const [isDailyRun, setIsDailyRun] = useState(false);

          const [gameState, setGameState] = useState('MENU');
          const [showRules, setShowRules] = useState(false);
          const [showPrivacy, setShowPrivacy] = useState(false);
          const [showTerms, setShowTerms] = useState(false);
          const [copyFeedback, setCopyFeedback] = useState("");
          const [hasSave, setHasSave] = useState(false);
          const [deathReason, setDeathReason] = useState(null);
          
          const [availableWords, setAvailableWords] = useState([]);
          const [targetWord, setTargetWord] = useState("");
          const [currentMonster, setCurrentMonster] = useState(MONSTERS[0]);
          const [guesses, setGuesses] = useState([]);
          const [currentGuess, setCurrentGuess] = useState("");
          const [usedLetters, setUsedLetters] = useState({});
          const [revealedIndices, setRevealedIndices] = useState([]);
          const [turn, setTurn] = useState(0);
          const [shake, setShake] = useState(false);
          const [feedbackMsg, setFeedbackMsg] = useState("");

          useEffect(() => {
            const key = getSaveKey(difficulty);
            setHasSave(!!localStorage.getItem(key));
            
            const dailyData = localStorage.getItem(DAILY_STORAGE_KEY);
            if (dailyData) {
                const { date } = JSON.parse(dailyData);
                const today = new Date().toDateString();
                if (date === today) setDailyCompleted(true);
            }
            const savedStats = localStorage.getItem(STATS_STORAGE_KEY);
            if (savedStats) setStats(JSON.parse(savedStats));
            const hasVisited = localStorage.getItem('wordQuestVisited');
            if (!hasVisited) {
                setShowRules(true);
                localStorage.setItem('wordQuestVisited', 'true');
            }
          }, [difficulty]);

          const saveGameData = (data) => {
            if (isDailyRun) return;
            try {
              const key = getSaveKey(data.difficulty || difficulty);
              localStorage.setItem(key, JSON.stringify(data));
              if (data.difficulty === difficulty) setHasSave(true);
            } catch (e) { console.error("Save failed:", e); }
          };

          const updateStats = (newValues) => {
              const updated = { ...stats, ...newValues };
              setStats(updated);
              localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify(updated));
          }

          const markDailyComplete = () => {
              const data = { date: new Date().toDateString(), completed: true };
              localStorage.setItem(DAILY_STORAGE_KEY, JSON.stringify(data));
              setDailyCompleted(true);
              
              // Add gold to ALL active saves
              ['EASY', 'NORMAL', 'HARD'].forEach(diff => {
                  try {
                      const key = getSaveKey(diff);
                      const saved = localStorage.getItem(key);
                      if (saved) {
                          const currentSave = JSON.parse(saved);
                          const newGold = (currentSave.gold || STARTING_GOLD) + 200;
                          const newSave = { ...currentSave, gold: newGold };
                          localStorage.setItem(key, JSON.stringify(newSave));
                      }
                  } catch(e) {}
              });
              
              // Update current state if not daily (unlikely here but safe)
              if(!isDailyRun) setGold(prev => prev + 200);
          };

          const loadGame = () => {
            try {
              const key = getSaveKey(difficulty);
              const saved = localStorage.getItem(key);
              if (saved) {
                const data = JSON.parse(saved);
                
                // Force daily mode off immediately when loading a main save
                setIsDailyRun(false);

                // --- CRITICAL FIX: REPAIR CORRUPTED SAVE ---
                if (!data.targetWord || !data.availableWords || data.availableWords.length === 0) {
                    console.log("Repairing save file...");
                    setHp(data.hp || STARTING_HP);
                    setMaxHp(data.maxHp || STARTING_HP);
                    setGold(data.gold || STARTING_GOLD);
                    setLevel(data.level || 1);
                    setDifficulty(data.difficulty || difficulty);
                    
                    // Regenerate words based on saved difficulty
                    let filteredWords = WORD_LIST;
                    const diff = data.difficulty || difficulty;
                    if (diff === 'EASY') filteredWords = WORD_LIST.filter(w => w.length >= 4 && w.length <= 5);
                    else if (diff === 'NORMAL') filteredWords = WORD_LIST.filter(w => w.length >= 4 && w.length <= 6);
                    else if (diff === 'HARD') filteredWords = WORD_LIST.filter(w => w.length >= 5);
                    
                    const uniqueWords = [...new Set(filteredWords)];
                    setAvailableWords(uniqueWords);
                    
                    // Start fresh level immediately
                    setTimeout(() => startLevel(data.level || 1, uniqueWords, {}, false), 50);
                } else {
                    // Standard Load
                    setHp(data.hp);
                    setMaxHp(data.maxHp);
                    setGold(data.gold);
                    setLevel(data.level);
                    setActiveBuffs(data.activeBuffs || {});
                    setDifficulty(data.difficulty || difficulty);
                    setAvailableWords(data.availableWords);
                    setTargetWord(data.targetWord);
                    setCurrentMonster(data.currentMonster || MONSTERS[0]);
                    setGuesses([]);
                    setCurrentGuess("");
                    setTurn(0);
                    setUsedLetters({});
                    setRevealedIndices(data.revealedIndices || []);
                    
                    setGameState('PLAYING');
                }
                setFeedbackMsg(""); 
              }
            } catch (e) {
              console.error("Load failed:", e);
              alert("Save file corrupted. Starting new game.");
              startGame();
            }
          };

          const returnToMenu = () => {
            if (!isDailyRun) {
                saveGameData({ hp, maxHp, gold, level, activeBuffs, difficulty, availableWords, targetWord, currentMonster, revealedIndices });
            }
            setIsDailyRun(false); // Reset daily flag when going to menu to prevent bleed-over
            setGameState('MENU');
            setFeedbackMsg(""); // Clear popups when leaving
          };

          const startGame = () => {
            const key = getSaveKey(difficulty);
            localStorage.removeItem(key);
            setHasSave(false);
            setHp(STARTING_HP);
            setMaxHp(STARTING_HP);
            setGold(STARTING_GOLD);
            setLevel(1);
            setActiveBuffs({});
            setUsedLetters({});
            setIsDailyRun(false);
            setIsNewRecord(false);
            let filteredWords = WORD_LIST;
            if (difficulty === 'EASY') filteredWords = WORD_LIST.filter(w => w.length >= 4 && w.length <= 5);
            else if (difficulty === 'NORMAL') filteredWords = WORD_LIST.filter(w => w.length >= 4 && w.length <= 6);
            else if (difficulty === 'HARD') filteredWords = WORD_LIST.filter(w => w.length >= 5);
            const uniqueWords = [...new Set(filteredWords)];
            setAvailableWords(uniqueWords);
            setTimeout(() => startLevel(1, uniqueWords, {}, true), 50);
          };

          const startDaily = () => {
              setIsDailyRun(true);
              setIsNewRecord(false);
              const { word, monster } = getDailyWordAndMonster();
              setTargetWord(word);
              setCurrentMonster(monster);
              setHp(200);
              setMaxHp(200);
              setGold(0);
              setLevel(1);
              setActiveBuffs({});
              setGuesses([]);
              setCurrentGuess("");
              setTurn(0);
              setUsedLetters({});
              setRevealedIndices([]);
              setFeedbackMsg("DAILY CHALLENGE START!");
              setTimeout(() => setFeedbackMsg(""), 2500);
              setGameState('PLAYING');
          };

          const startLevel = (lvl, currentBag = availableWords, currentBuffs = activeBuffs, isNewGame = false) => {
            if (currentBag.length === 0) {
                setGameState('VICTORY');
                const key = getSaveKey(difficulty);
                localStorage.removeItem(key);
                return;
            }
            const randomIndex = Math.floor(Math.random() * currentBag.length);
            const word = currentBag[randomIndex];
            const newBag = [...currentBag];
            newBag.splice(randomIndex, 1);
            setAvailableWords(newBag);
            let monsterIdx = Math.floor((lvl - 1) / 10);
            if (monsterIdx >= MONSTERS.length) monsterIdx = MONSTERS.length - 1;
            if (lvl > 5 && Math.random() > 0.7) monsterIdx = Math.min(monsterIdx + 1, MONSTERS.length - 1);
            const newMonster = MONSTERS[monsterIdx];
            setCurrentMonster(newMonster);
            setTargetWord(word);
            setGuesses([]);
            setCurrentGuess("");
            setTurn(0);
            setUsedLetters({});
            setFeedbackMsg("");
            setGameState('PLAYING');
            let nextRevealed = [];
            let nextBuffs = { ...currentBuffs };
            if (currentBuffs.hint) {
              const idx = Math.floor(Math.random() * word.length);
              nextRevealed = [idx];
              setRevealedIndices(nextRevealed);
              setFeedbackMsg("Magic Scroll Revealed a Letter!");
              nextBuffs.hint = false;
              setActiveBuffs(nextBuffs);
            } else {
              setRevealedIndices([]);
            }
            saveGameData({ hp: hp, maxHp: maxHp, gold: gold, level: lvl, activeBuffs: nextBuffs, difficulty: difficulty, availableWords: newBag, targetWord: word, currentMonster: newMonster, revealedIndices: nextRevealed });
          };

          const handleKeyPress = useCallback((key) => {
            if (gameState !== 'PLAYING') return;
            if (key === 'BACK') { setCurrentGuess(prev => prev.slice(0, -1)); return; }
            if (key === 'ENTER') { submitGuess(); return; }
            if (currentGuess.length < targetWord.length) { setCurrentGuess(prev => prev + key); }
          }, [currentGuess, gameState, targetWord]);

          useEffect(() => {
            const handleKeyDown = (e) => {
              const key = e.key.toUpperCase();
              if (key === 'BACKSPACE') handleKeyPress('BACK');
              else if (key === 'ENTER') handleKeyPress('ENTER');
              else if (/^[A-Z]$/.test(key)) handleKeyPress(key);
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [handleKeyPress]);

          const submitGuess = () => {
            const wordLength = targetWord.length;
            if (currentGuess.length !== wordLength) { triggerShake("Too short!"); return; }
            const newUsedLetters = { ...usedLetters };
            const result = [];
            const targetArr = targetWord.split('');
            const guessArr = currentGuess.split('');
            guessArr.forEach((char, i) => {
              if (char === targetArr[i]) {
                result[i] = { char, status: 'correct' };
                newUsedLetters[char] = 'correct';
                targetArr[i] = null;
              }
            });
            guessArr.forEach((char, i) => {
              if (!result[i]) {
                const indexInTarget = targetArr.indexOf(char);
                if (indexInTarget !== -1) {
                  result[i] = { char, status: 'present' };
                  if (newUsedLetters[char] !== 'correct') newUsedLetters[char] = 'present';
                  targetArr[indexInTarget] = null;
                } else {
                  result[i] = { char, status: 'absent' };
                  if (!newUsedLetters[char]) newUsedLetters[char] = 'absent';
                }
              }
            });
            setGuesses(prev => [...prev, result]);
            setUsedLetters(newUsedLetters);
            setTurn(prev => prev + 1);
            setCurrentGuess("");
            if (currentGuess === targetWord) {
              handleWin();
            } else {
              if (turn + 1 >= MAX_GUESSES) {
                handleLoss('turns');
              } else {
                handleMonsterAttack();
              }
            }
          };

          const handleMonsterAttack = () => {
            let dmg = Math.floor(currentMonster.damage * 0.5); 
            if (activeBuffs.armor) { dmg = Math.ceil(dmg * 0.5); }
            const newHp = Math.max(0, hp - dmg);
            setHp(newHp);
            setFeedbackMsg(activeBuffs.armor ? `Stone Skin blocked! You take ${dmg} dmg.` : `The ${currentMonster.name} hits you for ${dmg} dmg!`);
            if (newHp <= 0) { handleLoss('hp'); }
          };

          const handleWin = () => {
              if (isDailyRun) {
                  markDailyComplete();
                  setGameState('DAILY_VICTORY');
                  return;
              }
            let goldEarned = 50 + (MAX_GUESSES - turn) * 15;
            if (activeBuffs.lucky) { goldEarned *= 2; }
            updateStats({ totalGold: stats.totalGold + goldEarned, monstersSlain: stats.monstersSlain + 1 });
            const newGold = gold + goldEarned;
            setGold(newGold);
            const nextBuffs = { ...activeBuffs, armor: false, lucky: false };
            setActiveBuffs(nextBuffs);
            if (level % 5 === 0) {
              setGameState('SHOP');
              saveGameData({ hp, maxHp, gold: newGold, level, activeBuffs: nextBuffs, difficulty, availableWords, targetWord, currentMonster, revealedIndices });
            } else {
              setFeedbackMsg(`Victory! +${goldEarned} Gold`);
              setTimeout(() => {
                setLevel(prev => prev + 1);
                startLevel(level + 1, availableWords, nextBuffs);
              }, 1500);
            }
          };

          const handleLoss = (reason) => {
            setDeathReason(reason);
            setGameState('REVIVE_PROMPT');
          };

          const revivePlayer = () => {
            if (isDailyRun) { alert("No revives in Daily Challenge!"); return; }
            const sacrificeCost = Math.max(MIN_REVIVE_GOLD, Math.floor(gold / 2));
            if (gold < sacrificeCost) { alert(`You need at least ${sacrificeCost} Gold to revive!`); return; }
            setGold(prev => prev - sacrificeCost);
            setGameState('PLAYING');
            if (deathReason === 'hp') {
                setHp(Math.floor(maxHp * 0.5));
                setFeedbackMsg("Revived! 50% HP Restored.");
            } else if (deathReason === 'turns') {
                setTurn(turn - 3);
                setFeedbackMsg("Second Wind! +3 Guesses.");
            }
          };

          const confirmGameOver = () => {
            if (!isDailyRun) {
                const key = getSaveKey(difficulty);
                localStorage.removeItem(key);
                setHasSave(false);
                const currentModeKey = difficulty === 'EASY' ? 'highScoreEasy' : difficulty === 'NORMAL' ? 'highScoreNormal' : 'highScoreHard';
                if (level > stats[currentModeKey]) {
                    updateStats({ [currentModeKey]: level });
                    setIsNewRecord(true);
                } else {
                    setIsNewRecord(false);
                }
            }
            setGameState('GAMEOVER');
          };

          const triggerShake = (msg) => {
            setShake(true);
            setFeedbackMsg(msg);
            setTimeout(() => { setShake(false); setFeedbackMsg(""); }, 600);
          };

          const buyItem = (item) => {
            if (gold >= item.cost) {
              const newGold = gold - item.cost;
              let newHp = hp;
              let newMaxHp = maxHp;
              let newBuffs = { ...activeBuffs };
              if (item.type === 'heal') { newHp = Math.min(maxHp, hp + item.value); }
              else if (item.type === 'fullHeal') { newHp = maxHp; }
              else if (item.type === 'maxHp') { newMaxHp = maxHp + item.value; newHp = newHp + item.value; }
              else if (item.type === 'hint') {
                newBuffs.hint = true;
                alert("Magic Scroll Purchased! A letter will be revealed on the next floor.");
              } else if (item.type === 'armor') {
                newBuffs.armor = true;
                alert("Stone Skin Purchased! Damage reduced by 50% for the next floor.");
              } else if (item.type === 'lucky') {
                newBuffs.lucky = true;
                alert("Lucky Coin Purchased! Gold rewards doubled for the next floor.");
              }
              setGold(newGold);
              setHp(newHp);
              setMaxHp(newMaxHp);
              setActiveBuffs(newBuffs);
              saveGameData({ hp: newHp, maxHp: newMaxHp, gold: newGold, level, activeBuffs: newBuffs, difficulty, availableWords, targetWord, currentMonster, revealedIndices });
            } else {
              triggerShake("Not enough gold!");
            }
          };

          const shareResult = () => {
              let text = '';
              if (isDailyRun && gameState === 'DAILY_VICTORY') {
                   text = `📅 Word Quest Daily\n🏆 Boss Defeated!\n🔥 Strategy: ${MAX_GUESSES - turn}/${MAX_GUESSES} Guesses\n⚔️ Try it at https://guessaword.org`;
              } else if (gameState === 'SHOP') {
                   text = `🏰 Word Quest RPG\n⚔️ Currently on Floor ${level} (${difficulty})\n💰 Holding ${gold} Gold\n❤️ HP: ${hp}/${maxHp}\n⚔️ Beat my run at https://guessaword.org`;
              } else {
                   text = `🏰 Word Quest RPG\n💀 Died on Floor ${level} (${difficulty})\n💰 Collected ${gold} Gold\n⚔️ Try to beat me at https://guessaword.org`;
              }
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
              document.execCommand('copy');
              setCopyFeedback("Copied to clipboard!");
            } catch (err) {
              console.error('Fallback: Oops, unable to copy', err);
              setCopyFeedback("Copy failed :(");
            }
            document.body.removeChild(textArea);
            setTimeout(() => setCopyFeedback(""), 2000);
          };

          if (gameState === 'MENU') {
            return (
              <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4 font-sans relative">
                {showRules && <RulesModal onClose={() => setShowRules(false)} />}
                {showPrivacy && <TextModal title="Privacy Policy" content={
                  <div className="space-y-4">
                    <p><strong>Last Updated: {new Date().toLocaleDateString()}</strong></p>
                    <section>
                      <h3 className="font-bold text-white mb-1">1. Introduction</h3>
                      <p>Welcome to Word Quest RPG. Your privacy is important to us. This policy explains how we handle information when you play our game.</p>
                    </section>
                    <section>
                      <h3 className="font-bold text-white mb-1">2. Data We Collect</h3>
                      <p>We do not collect personally identifiable information (such as names, emails, or phone numbers) directly. All game progress (gold, health, floor level) is stored locally on your device using your browser's LocalStorage.</p>
                    </section>
                    <section>
                      <h3 className="font-bold text-white mb-1">3. Advertising & Cookies</h3>
                      <p>We use third-party vendors, including Google, to serve ads based on your prior visits to our website or other websites.</p>
                      <ul className="list-disc pl-5 mt-2 space-y-1">
                        <li>Google's use of advertising cookies enables it and its partners to serve ads to you based on your visit to this site and/or other sites on the Internet.</li>
                        <li>You may opt out of personalized advertising by visiting <a href="https://www.google.com/settings/ads" target="_blank" rel="noreferrer" className="text-blue-400 underline">Google Ad Settings</a>.</li>
                        <li>Alternatively, you can opt out of a third-party vendor's use of cookies for personalized advertising by visiting <a href="https://www.aboutads.info" target="_blank" rel="noreferrer" className="text-blue-400 underline">www.aboutads.info</a>.</li>
                      </ul>
                    </section>
                    <section>
                      <h3 className="font-bold text-white mb-1">4. Contact</h3>
                      <p>If you have questions about this policy, please contact us via the link in the footer.</p>
                    </section>
                  </div>
                } onClose={() => setShowPrivacy(false)} />}
                
                {showTerms && <TextModal title="Terms of Service" content={
                  <div className="space-y-4">
                    <section>
                      <h3 className="font-bold text-white mb-1">1. Acceptance of Terms</h3>
                      <p>By accessing and playing Word Quest RPG, you accept and agree to be bound by the terms and provision of this agreement.</p>
                    </section>
                    <section>
                      <h3 className="font-bold text-white mb-1">2. Use License</h3>
                      <p>Permission is granted to temporarily play the materials (information or software) on Word Quest RPG's website for personal, non-commercial transitory viewing only. You may not modify, copy, or attempt to decompile or reverse engineer any software contained on the website.</p>
                    </section>
                    <section>
                      <h3 className="font-bold text-white mb-1">3. Disclaimer</h3>
                      <p>The materials on Word Quest RPG's website are provided "as is". We make no warranties, expressed or implied, and hereby disclaim and negate all other warranties.</p>
                    </section>
                    <section>
                      <h3 className="font-bold text-white mb-1">4. Limitations</h3>
                      <p>In no event shall Word Quest RPG or its suppliers be liable for any damages (including, without limitation, damages for loss of data or profit) arising out of the use or inability to use the materials on this site.</p>
                    </section>
                    <section>
                      <h3 className="font-bold text-white mb-1">5. Fair Play</h3>
                      <p>We reserve the right to ban users or reset progress if we detect cheating, hacking, or exploitation of game bugs.</p>
                    </section>
                  </div>
                } onClose={() => setShowTerms(false)} />}
                
                <div className="max-w-md w-full text-center space-y-8 animate-fade-in flex-1 flex flex-col justify-center">
                  <div className="space-y-2">
                     <div className="flex justify-center"><Sword className="w-16 h-16 text-yellow-500" /></div>
                     <h1 className="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600 tracking-tighter drop-shadow-sm">
                      GUESS A WORD
                    </h1>
                    <h2 className="text-xl text-slate-400 font-serif italic">The Cursed Tower</h2>
                  </div>
                  
                  <div className="bg-slate-900 p-6 rounded-lg border border-slate-700 shadow-2xl space-y-4">
                    <div className="flex justify-between items-center mb-2">
                       <p className="text-slate-300 text-sm">Select Difficulty:</p>
                       <button onClick={() => setShowRules(true)} className="text-blue-400 text-xs flex items-center gap-1 hover:text-white"><HelpCircle size={14} /> How to Play</button>
                    </div>
                    
                    <div className="grid grid-cols-3 gap-2 bg-slate-800 p-1 rounded-lg">
                      <button 
                        onClick={() => setDifficulty('EASY')}
                        className={`py-2 rounded text-sm font-bold transition-all ${difficulty === 'EASY' ? 'bg-green-600 text-white shadow-lg scale-105' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}
                      >
                        Squire
                        <span className="block text-[10px] font-normal opacity-80">4-5 Letters</span>
                        <span className="block text-[9px] text-green-200 mt-1">Best: {stats.highScoreEasy}</span>
                      </button>
                      <button 
                        onClick={() => setDifficulty('NORMAL')}
                        className={`py-2 rounded text-sm font-bold transition-all ${difficulty === 'NORMAL' ? 'bg-blue-600 text-white shadow-lg scale-105' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}
                      >
                        Knight
                        <span className="block text-[10px] font-normal opacity-80">4-6 Letters</span>
                        <span className="block text-[9px] text-blue-200 mt-1">Best: {stats.highScoreNormal}</span>
                      </button>
                      <button 
                        onClick={() => setDifficulty('HARD')}
                        className={`py-2 rounded text-sm font-bold transition-all ${difficulty === 'HARD' ? 'bg-red-600 text-white shadow-lg scale-105' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}
                      >
                        Legend
                        <span className="block text-[10px] font-normal opacity-80">5-7 Letters</span>
                        <span className="block text-[9px] text-red-200 mt-1">Best: {stats.highScoreHard}</span>
                      </button>
                    </div>
                    
                    <div className="space-y-3 pt-2">
                        <button 
                            onClick={startDaily}
                            disabled={dailyCompleted}
                            className={`w-full py-3 rounded-lg text-lg font-bold shadow-lg flex items-center justify-center gap-2 transform transition border ${dailyCompleted ? 'bg-slate-800 border-slate-700 text-slate-500 cursor-not-allowed' : 'bg-purple-900 hover:bg-purple-800 border-purple-500 text-white hover:scale-[1.02]'}`}
                        >
                            <Calendar size={20} />
                            {dailyCompleted ? "Daily Completed" : "Daily Challenge"}
                        </button>

                        {hasSave && (
                        <button 
                            onClick={loadGame}
                            className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-lg shadow-lg flex items-center justify-center gap-2 transform transition hover:scale-[1.02]"
                        >
                            <Save size={20} /> Continue Run
                        </button>
                        )}

                        <button 
                        onClick={startGame}
                        className={`w-full ${hasSave ? 'bg-slate-700 hover:bg-red-900/50 text-slate-300' : 'bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white'} font-bold py-3 rounded-lg text-lg shadow-lg transform transition hover:scale-[1.02]`}
                        >
                        {hasSave ? "Start New Run (Reset)" : "Enter Dungeon"}
                        </button>
                    </div>
                  </div>

                  <div className="text-slate-400 text-xs space-y-4 max-w-sm mx-auto">
                     <div className="bg-slate-900/50 p-4 rounded border border-slate-800 text-left">
                        <h3 className="font-bold text-slate-300 mb-1 flex items-center gap-2"><Info size={14}/> About the Game</h3>
                        <p className="leading-relaxed">
                            Word Quest RPG is a roguelike word puzzle game. Battle your way through infinite floors of monsters by solving word puzzles. 
                            Manage your health and gold, buy powerful items, and see how high you can climb the Cursed Tower.
                        </p>
                        <p className="mt-2 text-blue-300 flex items-center gap-1">
                            <Save size={12} /> Progress is auto-saved every floor.
                        </p>
                     </div>
                     
                     <div className="flex justify-center items-center gap-4 text-slate-500 flex-wrap">
                         <button onClick={() => setShowPrivacy(true)} className="hover:text-white underline">Privacy Policy</button>
                         <span className="text-slate-700">|</span>
                         <button onClick={() => setShowTerms(true)} className="hover:text-white underline">Terms of Service</button>
                         <span className="text-slate-700">|</span>
                         <a href="mailto:contact@guessaword.org" className="hover:text-white underline flex items-center gap-1"><Mail size={12}/> Contact</a>
                     </div>
                     <p>© GuessAWord.org</p>
                  </div>
                </div>
              </div>
            );
          }

          if (gameState === 'REVIVE_PROMPT') {
              const sacrificeCost = Math.max(MIN_REVIVE_GOLD, Math.floor(gold / 2));
              const canAfford = gold >= sacrificeCost;

              return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4">
                    <div className="max-w-md w-full bg-slate-900 border-2 border-slate-700 rounded-xl p-8 text-center shadow-2xl animate-fade-in-up">
                        <Heart className="w-16 h-16 text-slate-700 mx-auto mb-4 animate-pulse" />
                        <h2 className="text-3xl font-bold text-white mb-2">You have fallen!</h2>
                        <p className="text-slate-400 mb-8">
                            {deathReason === 'hp' ? "The monster struck a fatal blow." : "You ran out of strength (guesses)."}
                        </p>
                        
                        <div className="space-y-3">
                            {!isDailyRun && (
                            <button 
                                onClick={revivePlayer}
                                disabled={!canAfford}
                                className={`w-full py-4 rounded-lg font-bold text-lg flex items-center justify-center gap-2 transition-all ${canAfford ? 'bg-yellow-600 hover:bg-yellow-500 text-white' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                            >
                                <Coins size={20} /> Sacrifice {sacrificeCost} Gold to Revive
                            </button>
                            )}
                            
                            {!canAfford && !isDailyRun && (
                                <p className="text-xs text-red-400">You need at least {MIN_REVIVE_GOLD} gold to revive.</p>
                            )}

                            <div className="h-px bg-slate-700 my-4"></div>

                            <button 
                                onClick={confirmGameOver}
                                className="w-full text-slate-500 hover:text-red-400 py-2 text-sm"
                            >
                                Accept Fate (Game Over)
                            </button>
                        </div>
                    </div>
                </div>
              );
          }

          if (gameState === 'DAILY_VICTORY') {
              return (
              <div className="min-h-screen bg-purple-950 text-slate-100 flex flex-col items-center justify-center p-4">
                <div className="max-w-md w-full text-center space-y-6">
                  <Trophy className="w-24 h-24 text-purple-400 mx-auto animate-bounce" />
                  <h1 className="text-4xl font-bold text-purple-400">DAILY CRUSHED!</h1>
                  <div className="bg-slate-900/80 p-6 rounded border border-purple-600">
                    <p className="text-lg text-white">Daily Boss Defeated!</p>
                    <p className="text-sm text-slate-400 mt-2">Come back tomorrow for a new challenge.</p>
                    <div className="mt-4 bg-yellow-900/40 p-3 rounded flex items-center justify-center gap-2 border border-yellow-700">
                        <Coins className="text-yellow-400" />
                        <span className="font-bold text-yellow-100">+200 Gold added to Main Run</span>
                    </div>
                  </div>
                  <button 
                    onClick={shareResult}
                    className="flex items-center justify-center gap-2 px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded text-white font-bold w-full mb-2"
                  >
                    <Share2 size={18} /> {copyFeedback || "Share Daily Result"}
                  </button>
                  <button 
                    onClick={() => setGameState('MENU')}
                    className="px-8 py-3 bg-slate-700 hover:bg-slate-600 rounded text-white font-bold w-full"
                  >
                    Return to Menu
                  </button>
                </div>
              </div>
            );
          }

          if (gameState === 'VICTORY') {
            return (
              <div className="min-h-screen bg-yellow-950 text-slate-100 flex flex-col items-center justify-center p-4">
                <div className="max-w-md w-full text-center space-y-6">
                  <Trophy className="w-24 h-24 text-yellow-400 mx-auto animate-bounce" />
                  <h1 className="text-4xl font-bold text-yellow-400">TOWER CONQUERED!</h1>
                  <div className="bg-slate-900/80 p-6 rounded border border-yellow-600">
                    <p className="text-lg text-white">You have defeated all {WORD_LIST.length} floors!</p>
                    <p className="text-2xl font-bold text-yellow-500 mt-2">{gold} Gold Collected</p>
                  </div>
                  <button 
                    onClick={shareResult}
                    className="flex items-center justify-center gap-2 px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded text-white font-bold w-full mb-2"
                  >
                    <Share2 size={18} /> {copyFeedback || "Share Result"}
                  </button>
                  <button 
                    onClick={() => setGameState('MENU')}
                    className="px-8 py-3 bg-slate-700 hover:bg-slate-600 rounded text-white font-bold w-full"
                  >
                    Play Again
                  </button>
                </div>
              </div>
            );
          }

          if (gameState === 'GAMEOVER') {
            return (
              <div className="min-h-screen bg-red-950 text-slate-100 flex flex-col items-center justify-center p-4">
                <div className="max-w-md w-full text-center space-y-6">
                  <Skull className="w-24 h-24 text-red-500 mx-auto animate-bounce" />
                  <h1 className="text-4xl font-bold text-red-500">{isDailyRun ? "DAILY FAILED" : "YOU DIED"}</h1>
                  <div className="bg-slate-900/80 p-6 rounded border border-red-900 relative overflow-hidden">
                    {isNewRecord && !isDailyRun && (
                        <div className="absolute top-0 right-0 bg-yellow-500 text-yellow-900 text-xs font-bold px-3 py-1 rounded-bl shadow-lg animate-pulse">
                            NEW RECORD!
                        </div>
                    )}
                    <p className="text-slate-400">{isDailyRun ? "The Daily Boss remains..." : `You reached Floor ${level}`}</p>
                    {!isDailyRun && <p className="text-2xl font-bold text-yellow-500 mt-2">{gold} Gold Collected</p>}
                    <p className="mt-4 text-sm text-slate-500">The word was: <span className="text-white font-bold">{targetWord}</span></p>
                  </div>
                  <button 
                    onClick={shareResult}
                    className="flex items-center justify-center gap-2 px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded text-white font-bold w-full mb-2"
                  >
                    <Share2 size={18} /> {copyFeedback || "Share Result"}
                  </button>
                  <button 
                    onClick={() => setGameState('MENU')}
                    className="px-8 py-3 bg-slate-700 hover:bg-slate-600 rounded text-white font-bold w-full"
                  >
                    Return to Menu
                  </button>
                </div>
              </div>
            );
          }

          if (gameState === 'SHOP') {
            return (
              <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col items-center p-4">
                 <Header level={level} hp={hp} maxHp={maxHp} gold={gold} remaining={availableWords.length} buffs={activeBuffs} isDaily={isDailyRun} onMenu={returnToMenu} />
                 
                 <div className="max-w-lg w-full mt-8 flex-1">
                    <div className="flex items-center gap-2 mb-6 justify-center">
                      <Sparkles className="text-yellow-400" />
                      <h2 className="text-2xl font-serif text-yellow-100">The Merchant</h2>
                    </div>

                    <AdContainer location="banner" />

                    <div className="grid gap-3 mt-4">
                      {SHOP_ITEMS.map(item => (
                        <button 
                          key={item.id}
                          onClick={() => buyItem(item)}
                          disabled={gold < item.cost}
                          className={`flex items-center justify-between p-3 rounded-lg border transition-all ${gold >= item.cost ? 'bg-slate-800 border-slate-600 hover:bg-slate-700 hover:scale-[1.02]' : 'bg-slate-900 border-slate-800 opacity-50 cursor-not-allowed'}`}
                        >
                          <div className="flex items-center gap-3">
                            <div className={`p-2 rounded-full border border-slate-700 bg-slate-900`}>
                              <item.Icon className={`w-4 h-4 ${item.iconColor}`} />
                            </div>
                            <div className="text-left">
                              <div className="font-bold text-sm">{item.name}</div>
                              <div className="text-[10px] text-slate-400">{item.effect}</div>
                            </div>
                          </div>
                          <div className="font-bold text-yellow-500 flex items-center gap-1 text-sm">
                            {item.cost} <Coins size={12} />
                          </div>
                        </button>
                      ))}
                    </div>

                    <div className="space-y-2 mt-6">
                        <button 
                        onClick={() => {
                            setLevel(l => l + 1);
                            startLevel(level + 1);
                        }}
                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-lg flex items-center justify-center gap-2 shadow-lg"
                        >
                        Next Floor <Sword size={16} />
                        </button>

                        <button 
                            onClick={shareResult}
                            className="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 rounded-lg flex items-center justify-center gap-2"
                        >
                            <Share2 size={16} /> {copyFeedback || "Share Progress"}
                        </button>
                    </div>
                 </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center">
              <Header level={level} hp={hp} maxHp={maxHp} gold={gold} remaining={availableWords.length} buffs={activeBuffs} isDaily={isDailyRun} onMenu={returnToMenu} />

              {/* Monster Display */}
              <div className={`w-full max-w-lg p-4 flex flex-col items-center justify-center relative bg-gradient-to-b ${isDailyRun ? 'from-purple-900 to-slate-950' : 'from-slate-900 to-slate-950'} border-b border-slate-800`}>
                <div className={`text-6xl mb-2 filter drop-shadow-xl animate-float`}>{currentMonster.emoji}</div>
                <div className={`text-xl font-bold ${currentMonster.color}`}>{currentMonster.name}</div>
                <div className="text-xs text-slate-500 mt-1 flex items-center gap-1">
                   <Sword size={12} /> Attack: {activeBuffs.armor ? Math.ceil(currentMonster.damage * 0.5) : currentMonster.damage} DMG
                   {activeBuffs.armor && <span className="text-blue-400 font-bold">(Shielded)</span>}
                </div>
                
                {feedbackMsg && (
                  <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-900/90 border border-slate-600 text-white px-4 py-2 rounded-lg shadow-xl whitespace-nowrap z-20 animate-fade-in-up">
                    {feedbackMsg}
                  </div>
                )}
              </div>

              <AdContainer location="banner" />

              {/* Game Grid */}
              <Grid 
                guesses={guesses} 
                currentGuess={currentGuess} 
                turn={turn} 
                shake={shake} 
                wordLength={targetWord ? targetWord.length : 5} 
                revealedIndices={revealedIndices}
                targetWord={targetWord}
              />

              {/* Controls */}
              <Keyboard onKeyPress={handleKeyPress} usedLetters={usedLetters} />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
